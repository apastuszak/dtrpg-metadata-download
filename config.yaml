# Copy/edit this file to point at your library. DTRPG_API_KEY (an
# Application Key from your DriveThruRPG account page, not your account
# password) must come from the environment or a separate secrets file —
# never hardcode it here.

root: /path/to/rpg/pdfs

data_dir: data
review_csv: data/review.csv
manual_overrides: data/manual_overrides.yaml
preferences: data/preferences.yaml   # your API key + DriveThruRPG name -- gitignored, never commit this file

# Optional, and specific to your own machine: path to a separate sibling
# project's hyperlink_pdf_universal.py (auto-hyperlinks in-text page/
# chapter references in GURPS PDFs -- see gurps_hyperlink.py). Only used
# when --hyperlink-gurps/the GUI's matching checkbox is turned on; safe
# to leave as this placeholder otherwise.
gurps_hyperlink_script: /path/to/hyperlink_pdf_universal.py

matching:
  high_confidence_threshold: 90.0
  review_floor_threshold: 70.0

dtrpg:
  catalog_rate_limit_seconds: 1.0

# Hand-filled metadata for titles with no DriveThruRPG listing at all
# (or that you've already identified elsewhere, e.g. a publisher's own
# site). Keyed by exact PDF filename. A book listed here skips the
# DriveThruRPG lookup and goes straight to tag's confirm screen, where it
# can still be edited. Any field can be left out; isbn is also accepted.
#
# Example:
#
# "GURPS Dungeon Fantasy 1 - Adventurers.pdf":
#   title: "GURPS Dungeon Fantasy 1: Adventurers"
#   series: "GURPS Dungeon Fantasy"
#   series_index: 1
#   publisher: "Steve Jackson Games"
#   authors:
#     - Sean Punch
#   tags:
#     - GURPS
#     - Fantasy
#   description: ""
#   product_url: ""
#   source: bits-and-mortar
